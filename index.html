<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image" href="img/budget.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <title>Expense Tracker</title>
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>

      <div class="balance">
        <h2>Your Balance</h2>
        <p class="balance-amt" id="balance">$1,000.00</p>

        <div class="summary">
          <div class="income-container">
            <h3>Income</h3>
            <p class="income-amt" id="income">0</p>
          </div>

          <div class="expenses-container">
            <h3>Expenses</h3>
            <p class="expense-amt" id="expenses">0</p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="transactions">
          <h2>Transactions</h2>
          <ul>
            <!-- transaction items will be here -->
          </ul>
        </div>

        <div class="form-container">
          <h2>Add Transactions</h2>
          <form action="">
            <div class="transaction-input">
              <label for="description">Description</label>
              <input type="text" name="description" id="description" />
            </div>

            <div class="transaction-input">
              <label for="amount">Amount</label>
              <input type="number" name="description" id="description" />
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
